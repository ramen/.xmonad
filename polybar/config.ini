[colors]
background = #1a1b26
foreground = #c0caf5
accent = #7aa2f7
muted = #565f89

[bar/main]
width = 100%
height = 56
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = "JetBrains Mono:size=20;4"
padding-left = 1
padding-right = 1
module-margin = 1
modules-left = xworkspaces
modules-center = date
modules-right = memory cpu gpu pulseaudio
tray-position = right
enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-foreground = ${colors.accent}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1

[module/date]
type = internal/date
interval = 5
date = %a %d %b  %H:%M

[module/pulseaudio]
type = internal/pulseaudio
label-volume = vol %percentage%%
use-ui-max = false

[module/memory]
type = internal/memory
label = mem %percentage_used%%

[module/cpu]
type = internal/cpu
label = cpu %percentage%%

[module/gpu]
type = custom/script
exec = nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits
interval = 2
format-prefix = "gpu "
label = %output%%
